user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Sıkıştırma
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream Tanımları
    upstream netopswan_frontend {
        server netopswan-panel:3000;
        keepalive 32;
    }

    upstream openwisp_backend {
        server openwisp_nginx:443;
        keepalive 32;
    }

    # =========================================================================
    # ANA HTTP / HTTPS GİRİŞ NOKTASI (Port 80 & 443)
    # =========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Güvenlik Başlıkları
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        client_max_body_size 50M;

        # ---------------------------------------------------------------------
        # 1. Şube Cihazlarının Merkez API & Controller Bağlantı Bacağı
        # (Şubeler bu uç noktalardan konfigürasyon çeker ve heartbeat atar)
        # ---------------------------------------------------------------------
        location /controller/ {
            proxy_pass https://openwisp_backend;
            proxy_ssl_verify off;
            proxy_set_header Host api.openwisp.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        location /api/ {
            proxy_pass https://openwisp_backend;
            proxy_ssl_verify off;
            proxy_set_header Host api.openwisp.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # ---------------------------------------------------------------------
        # 2. NetOpsWan Kurumsal Web Yönetim Paneli Bacağı
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://netopswan_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
