[package]
name = "netops-hub"
version = "0.4.15"
edition = "2021"
rust-version.workspace = true
description = "Central SD-WAN Gateway & Peer Coordinator for NetOpsWan"

[lints]
workspace = true

[dependencies]
netops-proto = { path = "../netops-proto" }
netops-ipam = { path = "../netops-ipam" }
netops-auth = { path = "../netops-auth" }
netops-command = { path = "../netops-command" }
netops-ota = { path = "../netops-ota" }
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-metrics = "0.4"
futures-util = "0.3"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
ipnet = "2.12"
socket2 = "0.6"
argon2 = "0.5"
password-hash = "0.5"
validator = { version = "0.19", features = ["derive"] }
indexmap = { version = "2.7", features = ["serde"] }
bytes = "1.10"
dashmap = "6.1"
sha2 = "0.10"

