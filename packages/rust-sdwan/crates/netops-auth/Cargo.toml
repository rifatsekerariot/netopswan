[package]
name = "netops-auth"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Cryptographic identity, Argon2id hashing and token validator for NetOpsWan"

[lints]
workspace = true

[dependencies]
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
base64ct = { version = "1.6", features = ["alloc"] }
jsonwebtoken = "9.3"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.2"
rcgen = "0.13"

ring = "0.17"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }


