[package]
name = "netops-proto"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Shared protocol definitions and crypto primitives for NetOpsWan SD-WAN"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "proto_benchmarks"
harness = false

