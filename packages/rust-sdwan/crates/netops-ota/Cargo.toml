[package]
name = "netops-ota"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Ed25519-signed, SHA-256 integrity-verified atomic rollback-protected OTA engine for NetOpsWan"

[lints]
workspace = true

[[bin]]
name = "netops-ota-tool"
path = "src/bin/tool.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
semver = { version = "1.0", features = ["serde"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
hex = "0.4"
