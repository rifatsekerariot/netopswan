[package]
name = "netops-command"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Event-driven, non-blocking remote command dispatch with Tokio oneshot channels for NetOpsWan"

[lints]
workspace = true

[dependencies]
tokio = { version = "1.43", features = ["sync", "time"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
netops-proto = { path = "../netops-proto" }
